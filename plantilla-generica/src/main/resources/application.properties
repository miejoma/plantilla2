spring.application.name=demo

# ===== PostgreSQL (crear antes la BD vacía; cambia el nombre, usuario y clave por los tuyos) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/bddemo
spring.datasource.username=postgres
spring.datasource.password=admin

# update = Hibernate crea/actualiza las tablas según las entidades
spring.jpa.hibernate.ddl-auto=update
# false = evita consultas perezosas fuera de la transacción (buena práctica en APIs)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ===== JWT =====
# Clave en HEXADECIMAL de 64 caracteres (la lee HexFormat.parseHex). Generar otra: openssl rand -hex 32
jwt.secret=3f8a9c2b1e4d5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a
